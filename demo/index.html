<title>Logoja e WhatsApp-it — Art me CSS</title>
<style>
.wa-stage{display:flex;justify-content:center;align-items:center;padding:30px 0}

.wa-phone{width:92px;height:92px;fill:#fff}
.page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;background:#e8f4fd;margin:0}
.page h1{margin:0 0 10px;color:#1f6f43;font-size:1.4rem}
.page p{color:#5c6b7f;margin:0 0 10px}
.credit{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:12px;color:#8a8f98;font-family:sans-serif;z-index:99;pointer-events:none}
.credit strong{color:#5c6b7f}
</style>
</head>
